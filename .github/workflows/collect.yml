name: Collect occupancy

on:
  schedule:
    # Every hour at :17 (UTC). Off the top of the hour because GitHub's scheduler
    # is busiest then and runs can be delayed or dropped.
    - cron: "17 * * * *"
  workflow_dispatch: # lets you click "Run workflow" to test it

permissions:
  contents: write # needed to commit the CSV back to the repo

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch occupancy
        run: python3 scrape.py
        env:
          # Last day to collect (inclusive, Davis local time). After this the job
          # still runs but makes no request. Disable the workflow when you're done.
          COLLECT_UNTIL: "2026-11-03"

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/occupancy.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
